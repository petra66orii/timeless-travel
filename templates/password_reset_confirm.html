<!doctype html>
<html>
  <head>
    <title>Redirecting...</title>
    <script>
      // Simple script to swap the port from 8000 (Django) to 5173 (React)
      var currentUrl = window.location.href;
      var frontendUrl = currentUrl.replace(":8000", ":5173");
      window.location.href = frontendUrl;
    </script>
  </head>
  <body>
    <h3>Redirecting to Password Reset...</h3>
    <p>
      If you are not redirected automatically, please
      <a id="manual-link" href="#">click here</a>.
    </p>
    <script>
      document.getElementById("manual-link").href =
        window.location.href.replace(":8000", ":5173");
    </script>
  </body>
</html>
